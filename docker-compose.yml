services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # API stays on loopback: only nginx (frontend) is reachable from the LAN.
    ports: ["127.0.0.1:8901:8901"]
    volumes: ["./data:/data"]
    environment:
      NODE_ENV: production
      PORT: 8901
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUBLIC_URL: ${PUBLIC_URL:-}
      APP_URL: ${APP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      IMPORT_ROOTS: ${IMPORT_ROOTS:-/data/imports}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8901/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["5199:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
