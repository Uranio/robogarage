server {
  listen 80;
  server_name _;

  # Avatars are 2 MB; commits up to 5 MB.
  client_max_body_size 8m;

  # Security headers. In production terminate TLS in front of this container
  # and add HSTS there.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://backend:8901;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    access_log off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
